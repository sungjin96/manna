<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <!-- 배경 그라디언트 -->
    <radialGradient id="bgGlow" cx="35%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1A1428" />
      <stop offset="100%" stop-color="#0B0A12" />
    </radialGradient>
    <!-- 골드 글로우 -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4A847" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#D4A847" stop-opacity="0" />
    </radialGradient>
    <!-- 아이콘 클립 -->
    <clipPath id="iconClip">
      <rect x="72" y="130" width="240" height="240" rx="52" ry="52" />
    </clipPath>
    <!-- 아이콘 그림자 필터 -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#D4A847" flood-opacity="0.25" />
    </filter>
    <!-- 텍스트 글로우 -->
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="1024" height="500" fill="url(#bgGlow)" />

  <!-- 미묘한 별 패턴 -->
  <g fill="#D4A847" opacity="0.12">
    <circle cx="800" cy="60" r="1.5"/>
    <circle cx="850" cy="120" r="1"/>
    <circle cx="920" cy="80" r="2"/>
    <circle cx="960" cy="160" r="1.2"/>
    <circle cx="740" cy="40" r="1"/>
    <circle cx="870" cy="200" r="1.5"/>
    <circle cx="990" cy="110" r="1"/>
    <circle cx="760" cy="180" r="1.2"/>
    <circle cx="680" cy="90" r="1"/>
    <circle cx="930" cy="300" r="1.5"/>
    <circle cx="820" cy="380" r="1"/>
    <circle cx="970" cy="350" r="1.2"/>
    <circle cx="700" cy="420" r="1"/>
    <circle cx="780" cy="460" r="1.5"/>
    <circle cx="650" cy="340" r="1"/>
    <circle cx="610" cy="150" r="1.2"/>
    <circle cx="580" cy="420" r="1"/>
  </g>

  <!-- 골드 글로우 원 (아이콘 뒤) -->
  <circle cx="192" cy="250" r="180" fill="url(#goldGlow)" />

  <!-- 아이콘 그림자 레이어 -->
  <rect x="72" y="130" width="240" height="240" rx="52" ry="52"
        fill="#D4A847" opacity="0.08" filter="url(#iconShadow)" />

  <!-- 앱 아이콘 -->
  <image href="icon.png"
         x="72" y="130" width="240" height="240"
         clip-path="url(#iconClip)"
         filter="url(#iconShadow)"
         preserveAspectRatio="xMidYMid slice" />

  <!-- 아이콘 테두리 -->
  <rect x="72" y="130" width="240" height="240" rx="52" ry="52"
        fill="none" stroke="#D4A847" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- 구분선 -->
  <line x1="368" y1="170" x2="368" y2="330"
        stroke="#D4A847" stroke-width="1" stroke-opacity="0.25" />

  <!-- 메인 텍스트 영역 -->
  <!-- 앱 이름 -->
  <text x="420" y="238"
        font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"
        font-size="58"
        font-weight="700"
        fill="#F5EDD6"
        letter-spacing="-1">만나</text>

  <!-- 부제 -->
  <text x="422" y="288"
        font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"
        font-size="26"
        font-weight="400"
        fill="#D4A847"
        letter-spacing="2"
        opacity="0.9">매일의 양식</text>

  <!-- 영어 서브타이틀 -->
  <text x="422" y="326"
        font-family="Georgia, serif"
        font-size="15"
        font-weight="400"
        fill="#8B7355"
        letter-spacing="3">DAILY BREAD · 성경 묵상</text>

  <!-- 하단 골드 라인 장식 -->
  <rect x="72" y="468" width="880" height="1" fill="#D4A847" opacity="0.15" />
</svg>
