                - button "추가 정보" [ref=e270] [cursor=pointer]: "?"
              - textbox "설명" [ref=e272]: "매일 성경을 읽고 싶지만 작심삼일로 끝나셨나요? 만나는 꾸준한 말씀 읽기를 돕는 AI 성경 동역자입니다. 읽기만 하는 성경 앱은 많습니다. 만나는 읽고, 생각하고, 기도하는 앱입니다. ■ 개역성경 전권 읽기 구약 39권, 신약 27권 — 총 66권 전체를 깔끔한 화면에서 읽을 수 있습니다. 절 단위로 읽은 곳을 표시하고, 진행률을 한눈에 확인하세요. ■ 연속 읽기 스트릭 매일 한 장씩 읽으면 스트릭이 쌓입니다. 불꽃 아이콘과 함께 \"오늘도 읽었다\"는 성취감을 느껴보세요. 5일, 30일, 100일 달성 시 특별한 축하 애니메이션이 기다립니다. ■ 레벨 & 뱃지 시스템 읽을수록 경험치(XP)가 쌓이고 레벨이 올라갑니다. Bronze부터 Diamond까지, 다양한 뱃지를 모아보세요. 첫 걸음, 3일 연속, 첫 묵상 등 자연스러운 목표가 읽기 습관을 만들어줍니다. ■ 통독 계획 맥체인 1년 통독, 연대기순 읽기 등 검증된 읽기 플랜을 제공합니다. 플랜을 선택하면 매일 읽을 분량이 자동으로 배정되고, 홈 화면에서 바로 시작할 수 있습니다. ■ 성경 검색 기억나는 단어 하나로 성경 전체를 검색하세요. \"천사\", \"사랑\", \"소망\" — 찾고 싶은 구절을 빠르게 찾아줍니다. ■ 읽기 알림 원하는 시간에 매일 알림을 받으세요. 아침 묵상, 점심 말씀, 저녁 기도 — 나만의 말씀 시간을 만들 수 있습니다. ■ 데이터 백업 읽기 기록, 묵상, 스트릭을 파일로 내보내고 복원할 수 있습니다. 기기를 바꿔도 그동안의 기록이 사라지지 않습니다. • • • Pro — AI와 함께하는 깊은 묵상 ■ AI 묵상 질문 읽은 구절을 선택하면, AI가 그 말씀에 맞는 묵상 질문 3개를 만들어줍니다. \"이 구절이 내 삶에 어떤 의미일까?\" — 혼자서는 놓치기 쉬운 질문을 던져줍니다. ■ AI 구절 해설 역사적 배경, 원어의 의미, 현대적 적용까지. 주석을 펼치지 않아도, AI가 구절의 맥락을 알기 쉽게 설명해줍니다. ■ AI 기도문 생성 오늘 읽은 말씀을 바탕으로, 나만의 기도문을 만들어줍니다. 읽고, 묵상하고, 기도하는 — 하나의 흐름이 완성됩니다. • • • 만나는 계정이 필요 없습니다. 설치하고 바로 읽기 시작하세요. 문의: sungjin5891@gmail.com 개인정보 처리방침: https://jjangsung.notion.site/Manna-33e95ab5ea7e805ab3d8f4f824171665"
